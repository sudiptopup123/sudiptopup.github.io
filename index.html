<!DOCTYPE html>
<html>
<head>
  <title>SUDIP TOPUP CENTER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #020617;
      color: white;
    }

    header {
      background: #0f172a;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
    }

    .note {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 5px;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px #000;
    }

    h3 {
      margin: 0 0 10px;
      color: #22c55e;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      background: #16a34a;
    }

    .price {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 5px;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>🎮 SUDIP TOPUP CENTER</header>
<div class="note">UID Required Only ✔️</div>

<div class="container">

  <div class="card">
    <h3>🔥 Diamond Top-Up</h3>

    <select id="amount">
      <option value="115 Diamonds = 100 Rs">115 💎 = 100💵</option>

      <option value="480 Diamonds = 390 Rs">480 💎 = 390💵</option>
      <option value="610 Diamonds = 490 Rs">610 💎 = 490💵</option>
      <option value="850 Diamonds = 690 Rs">850 💎 = 690💵</option>
      <option value="1090 Diamonds = 900 Rs">1090 💎 = 900💵</option>
      <option value="1240 Diamonds = 990 Rs">1240 💎 = 990💵</option>
      <option value="2530 Diamonds = 1900 Rs">2530 💎 = 1900💵</option>
      <option value="5060 Diamonds = 3800 Rs">5060 💎 = 3800💵</option>
      <option value="10120 Diamonds = 7600 Rs">10120 💎 = 7600💵</option>

  <div class="card">
    <h3>⭐ Weekly & Pass</h3>

    <input type="text" id="uid2" placeholder="Enter UID">

    <select id="amount2">
      <option value="Weekly 445 Diamonds = 200 Rs">Weekly (445💎) = 200💵</option>
      <option value="Monthly 2500 Diamonds = 950 Rs">Monthly (2500💎) = 950💵</option>
      <option value="Combo = 1140 Rs">Combo (W+M) = 1140💵</option>
      <option value="Level Up Pass = 585 Rs">Level Up Pass = 585💵</option>
      <option value="Weekly Lite = 75 Rs">Weekly Lite = 75💵</option>
    </select>

    <button onclick="order2()">Order via WhatsApp</button>
  </div>

</div>

<div class="footer">
  ⚡ Fast Delivery | 💳 eSewa / Khalti Accepted
</div>

<script>
function order() {
  var uid = document.getElementById("uid").value;
  var amount = document.getElementById("amount").value;

  var msg = "🔥 SUDIP TOPUP ORDER%0AUID: " + uid + "%0APackage: " + amount;

  window.open("https://wa.me/9779702987090?text=" + msg);
}

function order2() {
  var uid = document.getElementById("uid2").value;
  var amount = document.getElementById("amount2").value;

  var msg = "⭐ SUDIP TOPUP ORDER%0AUID: " + uid + "%0APackage: " + amount;

  window.open("https://wa.me/9779702987090?text=" + msg);
}
</script>

</body>
</html>
