<!DOCTYPE html>
<html>
<head>
  <title>SUDIP TOPUP CENTER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #020617;
      color: white;
    }

    header {
      background: #0f172a;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px #000;
    }

    h3 {
      margin: 0 0 10px;
      color: #22c55e;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      background: #16a34a;
    }

    .qr-box {
      text-align: center;
      margin-top: 10px;
    }

    .qr-box img {
      width: 180px;
      border-radius: 10px;
      margin-top: 5px;
    }

    .note {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>🎮 SUDIP TOPUP CENTER</header>
<div class="note">UID Required Only ✔️</div>

<div class="container">

  <!-- ORDER CARD -->
  <div class="card">
    <h3>🔥 Diamond Top-Up</h3>

    <input type="text" id="uid" placeholder="Enter UID">

    <select id="amount">
      <option value="115 Diamonds = 100 Rs">115 💎 = 100💵</option>
      <option value="240 Diamonds = 195 Rs">240 💎 = 195💵</option>
      <option value="355 Diamonds = 300 Rs">355 💎 = 300💵</option>
      <option value="480 Diamonds = 390 Rs">480 💎 = 390💵</option>
      <option value="610 Diamonds = 490 Rs">610 💎 = 490💵</option>
      <option value="850 Diamonds = 690 Rs">850 💎 = 690💵</option>
    </select>

    <button onclick="order()">Order via WhatsApp</button>
  </div>

  <!-- PAYMENT QR SECTION -->
  <div class="card">
    <h3>💳 Payment QR</h3>

    <div class="qr-box">
      <p>👉 eSewa Payment</p>
      <img src="https://via.placeholder.com/180x180.png?text=eSewa+QR" alt="eSewa QR">
    </div>

    <div class="qr-box">
      <p>👉 Khalti Payment</p>
      <img src="https://via.placeholder.com/180x180.png?text=Khalti+QR" alt="Khalti QR">
    </div>

    <p class="note">Pay after order confirmation on WhatsApp ✔️</p>
  </div>

</div>

<div class="footer">
  ⚡ Fast Delivery | 🎮 Trusted Top-Up Service
</div>

<script>
function order() {
  var uid = document.getElementById("uid").value;
  var amount = document.getElementById("amount").value;

  var msg = "🔥 SUDIP TOPUP ORDER%0AUID: " + uid + "%0APackage: " + amount;

  window.open("https://wa.me/977XXXXXXXXXX?text=" + msg);
}
</script>

</body>
  </html>
