<!DOCTYPE html>
<html>
<head>
  <title>SUDIP TOPUP GOD LEVEL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #020617;
      color: white;
    }

    header {
      background: #0f172a;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
    }

    .nav {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 10px;
      font-size: 13px;
      color: #94a3b8;
    }

    .container {
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 10px #000;
    }

    .card:hover {
      background: #1e293b;
    }

    .panel {
      display: none;
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
    }

    .log {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      background: #020617;
      padding: 10px;
      border-radius: 8px;
    }

  </style>
</head>

<body>

<header>🔥 SUDIP TOPUP GOD LEVEL</header>

<div class="nav">
  <div>🏠 Home</div>
  <div>📦 Orders</div>
  <div>💳 Payment</div>
</div>

<div class="container">

  <!-- GAME DASHBOARD -->
  <div class="grid">
    <div class="card" onclick="openPanel('Free Fire')">🔥 Free Fire</div>
    <div class="card" onclick="openPanel('PUBG')">🎯 PUBG</div>
  </div>

  <!-- ORDER PANEL -->
  <div class="panel" id="panel">

    <h3 id="gameTitle">Game</h3>

    <input type="text" id="uid" placeholder="Enter UID">

    <select id="pack">
      <option>115 💎 - 100💵</option>
      <option>240 💎 - 195💵</option>
      <option>355 💎 - 300💵</option>
      <option>480 💎 - 390💵</option>
    </select>

    <input type="text" id="contact" placeholder="WhatsApp Number">

    <button onclick="order()">PLACE ORDER</button>

    <div class="log" id="logBox"></div>

  </div>

</div>

<script>

let game = "";

function openPanel(g) {
  game = g;
  document.getElementById("gameTitle").innerText = g + " TOPUP";
  document.getElementById("panel").style.display = "block";
}

function order() {
  let uid = document.getElementById("uid").value;
  let pack = document.getElementById("pack").value;

  let msg = "🔥 GOD LEVEL ORDER%0AGame: " + game +
            "%0AUID: " + uid +
            "%0APackage: " + pack;

  document.getElementById("logBox").innerHTML =
    "✔ ORDER CREATED<br>Game: " + game +
    "<br>UID: " + uid +
    "<br>Pack: " + pack +
    "<br>Status: Pending ⏳";

  window.open("https://wa.me/9779702987090?text=" + msg);
}

</script>

</body>
</html>
