<!DOCTYPE html>
<html>
<head>
  <title>SUDIP TOPUP CENTER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #020617;
      color: white;
    }

    header {
      background: #0f172a;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
    }

    .container {
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 10px #000;
    }

    .card:hover {
      background: #1e293b;
    }

    /* FORM */
    .form-box {
      display: none;
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover {
      background: #16a34a;
    }

    .summary {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }

  </style>
</head>

<body>

<header>🎮 SUDIP TOPUP CENTER</header>

<div class="container">

  <!-- GAME SELECTION -->
  <div class="grid">
    <div class="card" onclick="openForm('Free Fire')">🔥 Free Fire</div>
    <div class="card" onclick="openForm('PUBG')">🎯 PUBG</div>
  </div>

  <!-- ORDER FORM -->
  <div class="form-box" id="formBox">

    <h3 id="gameTitle">Game</h3>

    <input type="text" id="uid" placeholder="Enter UID">

    <select id="package">
      <option>Small Pack</option>
      <option>Medium Pack</option>
      <option>Large Pack</option>
    </select>

    <input type="text" id="contact" placeholder="WhatsApp Number">

    <button onclick="order()">Place Order</button>

    <div class="summary" id="summary"></div>

  </div>

</div>

<script>
let game = "";

function openForm(g) {
  game = g;
  document.getElementById("gameTitle").innerText = g + " Top-Up";
  document.getElementById("formBox").style.display = "block";
}

function order() {
  let uid = document.getElementById("uid").value;
  let pack = document.getElementById("package").value;
  let contact = document.getElementById("contact").value;

  let msg = "🔥 TOPUP ORDER%0A" +
            "Game: " + game + "%0A" +
            "UID: " + uid + "%0A" +
            "Package: " + pack;

  document.getElementById("summary").innerHTML =
    "✔ Order Ready<br>Game: " + game +
    "<br>UID: " + uid +
    "<br>Package: " + pack;

  window.open("https://wa.me/9779702987090?text=" + msg);
}
</script>

</body>
  </html>
